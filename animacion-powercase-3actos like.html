<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<title>Animación firma Powercase — 3 actos</title>
<style>
  /* ========= TIMING (segundos) — editá acá ========= */
  :root {
    --trazo: 1.6s;        /* acto 1: dibujo del contorno */
    --relleno: 1.9s;      /* acto 1: momento del relleno */
    --acto1fin: 3.4s;     /* la P se despide */
    --acto2: 4.0s;        /* arranca POWERCASE */
    --letra: 0.42s;       /* duración de entrada de cada letra */
    --paso: 0.13s;        /* intervalo entre letras */
    --acto2fin: 6.6s;     /* POWERCASE se despide */
    --acto3: 7.2s;        /* arranca el slogan (tipeo) */
    --ciclo: 11000;       /* ms del loop completo */
  }
  body { background:#EDEDED; font-family:Helvetica,Arial,sans-serif; display:flex; flex-direction:column; align-items:center; gap:28px; padding:44px; }
  h1 { font-size:13px; letter-spacing:2px; text-transform:uppercase; color:#888; font-weight:normal; }
  .stages { display:flex; align-items:flex-end; gap:40px; }
  .stage { position:relative; width:280px; height:280px; background:#FFF; box-shadow:0 1px 8px rgba(0,0,0,.08); overflow:hidden; flex:none; }
  .stage.mini { transform:scale(.5); transform-origin:bottom left; margin-right:-140px; }
  .cap { font-size:10px; color:#999; text-align:center; margin-top:8px; }
  .stage img, .stage svg { position:absolute; display:block; }

  /* ---- ACTO 1: la P ---- */
  svg.iso { left:76px; top:75px; width:128px; height:130px; }
  svg.iso path { stroke:#BD1516; stroke-width:70; fill:#BD1516; fill-opacity:0; }
  .play svg.iso path { animation: dibujar var(--trazo) cubic-bezier(.45,0,.4,1) both,
                                   rellenar .55s ease both,
                                   tinte .45s ease both;
                        animation-delay: .2s, var(--relleno), calc(var(--relleno) + .75s); }
  .play svg.iso { animation: actoOut .45s ease both; animation-delay: var(--acto1fin); }
  @keyframes dibujar  { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset:0; } }
  @keyframes rellenar { to { fill-opacity:1; } }
  @keyframes tinte    { to { stroke:#E01D1B; fill:#E01D1B; } }
  @keyframes actoOut  { to { opacity:0; transform:scale(.96); } }

  /* ---- ACTO 2: POWERCASE centrado ---- */
  .seg { top:124px; height:33px; width:auto; opacity:0; }
  .play .g0 { animation: in0 var(--letra) cubic-bezier(.25,1.4,.4,1) both, actoOut .4s ease both;
      animation-delay: calc(var(--acto2) + 0 * var(--paso)), var(--acto2fin); }
    @keyframes in0 { from { opacity:0; transform:translateX(-32px); filter:blur(2.5px); } to { opacity:1; transform:none; filter:blur(0); } }
.play .g1 { animation: in1 var(--letra) cubic-bezier(.25,1.4,.4,1) both, actoOut .4s ease both;
      animation-delay: calc(var(--acto2) + 1 * var(--paso)), var(--acto2fin); }
    @keyframes in1 { from { opacity:0; transform:translateY(-38px); filter:blur(2.5px); } to { opacity:1; transform:none; filter:blur(0); } }
.play .g2 { animation: in2 var(--letra) cubic-bezier(.25,1.4,.4,1) both, actoOut .4s ease both;
      animation-delay: calc(var(--acto2) + 2 * var(--paso)), var(--acto2fin); }
    @keyframes in2 { from { opacity:0; transform:translateY(32px); filter:blur(2.5px); } to { opacity:1; transform:none; filter:blur(0); } }
.play .g3 { animation: in3 var(--letra) cubic-bezier(.25,1.4,.4,1) both, actoOut .4s ease both;
      animation-delay: calc(var(--acto2) + 3 * var(--paso)), var(--acto2fin); }
    @keyframes in3 { from { opacity:0; transform:perspective(300px) rotateX(80deg); filter:blur(2.5px); } to { opacity:1; transform:none; filter:blur(0); } }
.play .g4 { animation: in4 var(--letra) cubic-bezier(.25,1.4,.4,1) both, actoOut .4s ease both;
      animation-delay: calc(var(--acto2) + 4 * var(--paso)), var(--acto2fin); }
    @keyframes in4 { from { opacity:0; transform:translateX(28px); filter:blur(2.5px); } to { opacity:1; transform:none; filter:blur(0); } }
.play .g5 { animation: in5 var(--letra) cubic-bezier(.25,1.4,.4,1) both, actoOut .4s ease both;
      animation-delay: calc(var(--acto2) + 5 * var(--paso)), var(--acto2fin); }
    @keyframes in5 { from { opacity:0; transform:rotate(-40deg) scale(.55); filter:blur(2.5px); } to { opacity:1; transform:none; filter:blur(0); } }
.play .g6 { animation: in6 var(--letra) cubic-bezier(.25,1.4,.4,1) both, actoOut .4s ease both;
      animation-delay: calc(var(--acto2) + 6 * var(--paso)), var(--acto2fin); }
    @keyframes in6 { from { opacity:0; transform:scale(1.9); filter:blur(2.5px); } to { opacity:1; transform:none; filter:blur(0); } }
.play .g7 { animation: in7 var(--letra) cubic-bezier(.25,1.4,.4,1) both, actoOut .4s ease both;
      animation-delay: calc(var(--acto2) + 7 * var(--paso)), var(--acto2fin); }
    @keyframes in7 { from { opacity:0; transform:translateY(26px) scale(.8); filter:blur(2.5px); } to { opacity:1; transform:none; filter:blur(0); } }

  /* ---- ACTO 3: slogan monoespaciado ---- */
  .slogan { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; opacity:0; }
  .play .slogan { animation: aparecer .3s ease both; animation-delay: var(--acto3); }
  .slogan .regla { width:34px; height:3px; background:#E01D1B; }
  .slogan .tw { font-family:'Courier New', Courier, monospace; font-size:19px; letter-spacing:1px; color:#414402; white-space:nowrap; }
  .slogan .cursor { display:inline-block; width:10px; height:20px; background:#E01D1B; vertical-align:text-bottom; animation: parpadeo .55s steps(1) infinite; }
  .slogan .badge { position:static; width:30px; opacity:0; transform:scale(1.6) rotate(-20deg); }
  .play .badge { animation: sello .35s cubic-bezier(.25,1.4,.4,1) both; animation-delay: calc(var(--acto3) + 1.5s); }
  @keyframes aparecer { to { opacity:1; } }
  @keyframes parpadeo { 50% { opacity:0; } }
  @keyframes sello { to { opacity:1; transform:none; } }
  button { border:1px solid #BBB; background:#FFF; padding:8px 22px; font-size:12px; letter-spacing:1px; cursor:pointer; }
</style></head>

<button onclick="reiniciar()">▶ repetir</button>
<script>
  const FRASE = "behind the power";
  const s1=document.getElementById('s1'), s2=document.getElementById('s2');
  s2.innerHTML = s1.innerHTML;
  const cs = getComputedStyle(document.documentElement);
  const seg = v => parseFloat(cs.getPropertyValue(v))*1000;
  const ACTO3 = seg('--acto3'), CICLO = parseInt(cs.getPropertyValue('--ciclo'));

  document.querySelectorAll('svg.iso path').forEach(p=>{
    const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.setProperty('--len',L);
  });

  let timers=[];
  function tipear() {
    document.querySelectorAll('.texto').forEach(t=>t.textContent='');
    FRASE.split('').forEach((ch,i)=>{
      timers.push(setTimeout(()=>{
        document.querySelectorAll('.texto').forEach(t=>t.textContent+=ch);
      }, ACTO3+250+i*70));
    });
  }
  function reiniciar() {
    timers.forEach(clearTimeout); timers=[];
    [s1,s2].forEach(s=>{ s.classList.remove('play'); void s.offsetWidth; s.classList.add('play'); });
    tipear();
  }
  reiniciar();
  setInterval(reiniciar, CICLO);
</script>
